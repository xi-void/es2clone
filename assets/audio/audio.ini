# Paths are relative to this audio directory; never use absolute paths.
# local.ini (ignored by Git) overrides this file; --audio-config overrides both.
[volumes]
# 0..1. Blank uses the pilot's saved F2 setting (or built-in default).
music =
effects =
machinery =
warning =

[music]
mode = sequential
menus = false
crossfade_seconds = 0.75
warning_duck = 0.32
# auto reserves the first 001_/01_ numbered track as the level-start cue.
# Or specify music/filename.mp3, or none to disable the cue.
startup_track = auto

[events]
# Pipe-separated relative paths select variants at unchanged pitch and duration.
# Example: foot_left = sfx/original/FOOT2.WAV
# Missing mappings/files use fallback/<event>.wav, then procedural effects.
laser =
cannon =
missile =
impact =
explosion =
lock =
wave =
win =
lose =
overheat =
foot_left =
foot_right =
hydraulic_left =
hydraulic_right =
reactor_ignition =
system_init =
mechanical_activate =
reactor_ready =
turbo_engage =
turbo_release =
reactor_shutdown =
damage_warning =

[loops]
reactor =
servo =
turbo =

[gains]
# Per-event gain (0..2). Imported effects retain their original dynamics.
foot_left = 0.75
foot_right = 0.75
